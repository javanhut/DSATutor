[project]
name = "dsatutor"
version = "0.1.0"
description = "Local Piper text-to-speech for DSATutor lesson narration (see docs/tts.md)"
readme = "README.md"
# piper-tts 1.8's espeakbridge wheel is broken on macOS under Python 3.14
# (espeak data dir mis-resolution), so stay on 3.12 locally; the Docker
# image uses Python 3.12 as well.
requires-python = ">=3.12,<3.14"
dependencies = [
    "piper-tts>=1.8.0",
]
